name = "eds-labs-service-booking"
account_id = "YOUR_ACCOUNT_ID"
main = "worker.js"
compatibility_date = "2026-10-07"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "http://localhost:3000"
EDS_SITE = "labs--edsmasterclass"

[[d1_databases]]
binding = "DB"
database_name = "eds-labs-service-booking"
database_id = "YOUR_DATABASE_ID"
migrations_dir = "schema"

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
